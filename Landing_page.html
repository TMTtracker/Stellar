<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Stellar</title>

    <link rel="stylesheet" href="css/landing.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Libre+Baskerville:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">

</head>


<body>

    

    <header class="top-header">

    <div class="header-spacer"></div>

    <div class="header-buttons">

        <button class="login-btn">
            Log In
        </button>

        <button class="signup-btn">
            Sign Up
        </button>

      

    </div>

</header>

<main class="landing-content">

    <section class="hero-section">

        <div class="hero-text">

            <h1 class="hero-title">
                STELLAR
            </h1>
            <h1>
                Elevate Your Learning Experience
            </h1>

            <p class="hero-subtitle">
            Boost your dopamine levels and enhance your skills with our engaging courses and interactive community. Build your knowledge in a fun and rewarding way.
            </p>

        </div>

        <div class="hero-model-container">

            <div id="three-container">

                <!-- Three.js canvas will be inserted here -->

            </div>

        </div>

    </section>

</main>

    <nav class="sidebar">

    <div class="logo">
        <img src="icons/logo-icon.svg" alt="Stellar Logo">

    </div>

    <ul class="nav-links">

        <li>
            <a href="#" data-tooltip="Home">
                <div class="icon-placeholder"></div>
            </a>
        </li>

        <li>
            <a href="#" data-tooltip="Courses">
                <div class="icon-placeholder active"></div>
            </a>
        </li>

        <li>
            <a href="#" data-tooltip="Tasks">
                <div class="icon-placeholder"></div>
            </a>
        </li>

        <li>
            <a href="#" data-tooltip="Leaderboard">
                <div class="icon-placeholder"></div>
            </a>
        </li>

        <li>
            <a href="#" data-tooltip="Community">
                <div class="icon-placeholder"></div>
            </a>
        </li>

    </ul>

</nav>
</body>

</html>
